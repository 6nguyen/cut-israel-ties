detail_md: |
  **What is this bill?** Every year Congress passes one big bill that sets
  what the US military does and buys. In Washington it is called the NDAA.
  The House and the Senate each passed their own version this summer, and
  a small group from both sides is now merging them into one final text.

  **What is the integration section?** Both versions carry a section
  (number 219 in the House version, 1217 in the Senate version) that
  orders the Pentagon to plan, train and stock weapons jointly with
  Israel's military, as a standing arrangement rather than a one-off. In
  plain terms, it makes Israel's wars the US military's job by default.

  **Why call now?** The group writing the final text can drop the section,
  keep it, or reword it. Once they file it, each chamber gets one yes-or-no
  vote on the whole bill with no changes allowed. Staff count calls from
  home while the text is being written, so a call this week can still move
  it. After filing, the only move left is a no vote on the whole bill.
prep_md: |
  ## Where things stand
  *As of 2026-11-04.* The House and Senate passed different versions of
  this year's military bill, and a small group from both chambers is
  writing the single final text both will vote on. The Israel integration
  section is number 219 in the House version and 1217 in the Senate
  version [VERIFY: section numbers against the enrolled text]. That group
  is meeting now and staff are counting calls from home before the text is
  filed. Once filed, it gets one vote with no changes allowed, so the
  useful moment for a call is before filing. In July the Senate failed to
  get the votes to even start debate, 50-46 on 2026-07-14 [VERIFY:
  senate.gov roll call; the amendments to strike the section were never
  voted on].

  ## Timeline
  - 2026-10-01: our window opens.
  - 2026-11-04: the final text is being written; calls are being counted.
  - 2026-12-10: final text expected [VERIFY: placeholder date, set it when
    the vote is scheduled].
  - After filing: one yes-or-no vote in each chamber, no changes. The
    next goal ("Block the military bill if Israel integration stays in")
    opens when this one closes.
  - 2026-12-31: our window closes.

  ## What to say in 30 seconds
  "Hello, I'm a constituent from [your town]. The people writing the final
  military bill are deciding whether to keep the Israel integration
  section, House 219 and Senate 1217. Please ask them to drop it. If it is
  still in the final bill, I'm asking [Rep./Sen. name] to vote no on the
  bill. Can you tell me where they stand, or take my name and number so
  they can answer?"

  ## Likely pushback and answers
  - **"The member supports Israel's security."** This is not a call about
    the level of aid. It is about one section that ties US troops and
    weapons to Israel's military as a standing arrangement. Ask for a
    position on that section.
  - **"It's too late; the bill already passed."** Both chambers passed
    different versions; the group writing the final text can still drop
    the section. After filing, the only move left is a no vote on the
    whole bill.
  - **"The member can't commit before the final text exists."** Ask them
    to tell the people writing it now, and to say whether a bill that
    keeps the section loses their vote. A stated "undecided" is still a
    position we record.
  - **"Call someone on that committee instead."** They listen most to
    their own constituents. Ask your member to pass the request to them
    [VERIFY: the conferee list; it is not in data/ yet].

  ## What counts as a win
  The final bill is filed without the integration section. A reworded
  version that keeps the joint planning or weapons provisions is not a win
  until the text is read [VERIFY: compare against 219 and 1217]. Short of
  that, a member who says publicly that they will vote no on a bill that
  keeps the section is a win for your call. Report the answer you got;
  positions are recorded from reports, with a source.

  ## Sources
  The record of the final-bill talks is added to this goal's source rows
  as it is read. [VERIFY: the conference report and the roll call linked
  from this page.]
