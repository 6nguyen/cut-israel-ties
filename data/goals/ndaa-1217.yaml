title: Strip the Israel integration section from the NDAA
summary: House and Senate conferees are reconciling the FY27 NDAA. The integration section (House §219 / Senate §1217) locks US forces into joint operations and munitions pipelines with Israel. Conferees can delete it.
what_we_want: Conferees drop the integration section from the conference report; members vote no on a report that keeps it.
