prep_md: |
  ## Where things stand
  *As of 2026-11-04.* The House Democratic caucus votes on its leadership and
  on whether to whip against the integration section of the NDAA (House §219
  [VERIFY: section number against the enrolled text]). A member's position
  is set in private calls with leadership before the vote, so a constituent
  call lands while the position is still open. The caucus meeting date is a
  placeholder, 2026-11-18 [VERIFY: caucus date].

  ## Timeline
  - 2026-11-01: our window opens.
  - 2026-11-18: caucus meeting, placeholder date [VERIFY].
  - 2026-12-10: NDAA conference report expected [VERIFY: placeholder; see
    the NDAA goal].
  - 2027-01-31: our window closes.

  ## What to say in 30 seconds
  "Hello, I'm a constituent from [your town]. Before the caucus votes,
  I'm asking Representative [name] to say, on the record, that they will vote
  against any NDAA conference report that keeps the Israel integration
  section. Can you tell me where the Representative stands, or pass this to
  the legislative staff?"

  ## Likely pushback and answers
  - **"The member doesn't discuss caucus matters."** The ask is a public
    statement of the member's own vote, not a report on the caucus.
  - **"The report doesn't exist yet."** The commitment is conditional: a no
    vote if the section survives conference.
  - **"The member already supports Israel's security."** The ask is about
    one section, not about aid levels. Ask for a position on the section.
  - **"Call the leadership instead."** Leadership counts its members' calls
    first; a member who hears from their district is the one who carries it
    into those private calls.

  ## What counts as a win
  Your representative states on the record that they will vote no on a
  report that keeps the section. Smaller: they say they are undecided and
  will tell you when they decide. Report what you hear; positions are
  recorded from reports, with a source.

  ## Sources
  This goal's source rows are added as the caucus calendar and the
  member's statements are sourced. [VERIFY: caucus date and any statement
  of position, from a primary source.]
