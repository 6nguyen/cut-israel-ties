title: Kick out Chuck Schumer
summary: Chuck Schumer runs the Democrats in the Senate. This winter, Senate Democrats vote in secret on whether he keeps the job, and several incoming senators have already said no. If you have a Democratic senator, their ballot is the lever, and a call from you lands before they cast it.
