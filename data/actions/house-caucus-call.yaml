slug: house-caucus-call
goal: house-caucus
type: call
target_scope: house
order: 1
ask_text: Ask your representative to say on the record that they will vote against any NDAA report that keeps the integration section.
form_schema:
  fields:
    - {name: first_name, label: First name, max: 40, required: true}
    - {name: city, label: City, max: 60, required: true}
    - {name: why, label: Why this matters to you, max: 280, required: true, multiline: true, hint: One or two sentences in your own words.}
    - {name: affiliation, label: Occupation or affiliation (optional), max: 80, required: false}
prompt_template: |
  Open with the caller's first name and city. Ask the representative to say on the record that they will vote against
  any NDAA report that keeps the integration section, so the caucus whip count reflects it. Name the prior vote if the
  facts list one. Close by asking for a yes or no and when the office will say so publicly.
doc_format: {"kind": "call_script", "min_words": 60, "max_words": 120, "mentions": ["integration section", "NDAA"], "ask": "on the record"}
standard_template: |
  Hi, my name is {{user_first_name}} and I live in {{user_city}}, in {{target_role}} {{target_name}}'s district.
  I am calling about the NDAA conference report. I am asking {{target_role}} {{target_name}} to say on the record that they will vote against any NDAA report that keeps the integration section. {{prior_vote_line}} {{position_line}}
  {{user_why}}
  Is {{target_role}} {{target_name}} willing to say that publicly, yes or no, and when will the office say so? Thank you for your time.
