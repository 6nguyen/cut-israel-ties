id: 2
slug: ndaa-1217-call
goal: ndaa-1217
type: call
target_scope: both
order: 1
ask_text: Ask your member to tell the conferees to drop the integration section, and to vote no on a report that keeps it.
form_schema:
  fields:
    - {name: first_name, label: First name, max: 40, required: true}
    - {name: city, label: City, max: 60, required: true}
    - {name: why, label: Why this matters to you, max: 280, required: true, multiline: true, hint: One or two sentences in your own words.}
    - {name: affiliation, label: Occupation or affiliation (optional), max: 80, required: false}
prompt_template: |
  Open with the caller's first name and city. Ask the office to tell the conferees to drop the integration section
  (House section 219, Senate section 1217) and to vote no on any conference report that keeps it. If the facts list
  a prior vote, name it in one sentence. Weave the caller's reason in as their own words, then close by asking what the
  member will do.
doc_format: {"kind": "call_script", "min_words": 60, "max_words": 120, "mentions": ["integration section", "1217", "219"], "ask": "drop the integration section"}
